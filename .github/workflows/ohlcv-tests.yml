name: ohlcv tests

# Runs the ohlcv SELF-RUNNING test scripts whenever anything in the skill
# folder changes (any branch on push, and on PRs that touch it).
# Stdlib-only — no network, no S3, no deps — so this is fast and needs no setup.
#
# Same two-contract split as the other skills: self-running scripts live here,
# and any module that imports pytest is skipped and must instead be listed in
# execution-tape-tests.yml's PYTEST_TARGETS, or it would run nowhere.
# Running a pytest module with bare python3 either dies on its first
# third-party import, or — worse — defines its functions and exits 0 having
# executed nothing. So this loop skips anything that imports pytest, and
# requires every file it DOES run to report what it passed: exit 0 with no
# "passed" line is a false green, not a pass.
on:
  push:
    paths:
      - 'skills/ohlcv/**'
      - '.github/workflows/ohlcv-tests.yml'
  pull_request:
    paths:
      - 'skills/ohlcv/**'
      - '.github/workflows/ohlcv-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ohlcv self-running test scripts
        run: |
          shopt -s nullglob
          ran=0
          for t in skills/ohlcv/tests/test_*.py; do
            if grep -qE '^(import|from) pytest\b' "$t"; then
              echo "=== $t: pytest module — run by execution-tape-tests.yml, skipped here ==="
              continue
            fi
            echo "=== $t ==="
            # Capture stdout so the summary line survives a failing exit;
            # tracebacks go to stderr and still stream live.
            if ! out="$(python3 "$t")"; then
              printf '%s\n' "$out"
              echo "::error file=$t::test script failed"
              exit 1
            fi
            printf '%s\n' "$out"
            if ! grep -q "passed" <<<"$out"; then
              echo "::error file=$t::exited 0 without reporting passed checks — not a self-running test script; either give it a runner or move it to execution-tape-tests.yml"
              exit 1
            fi
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::no self-running test scripts executed under skills/ohlcv/tests/"
            exit 1
          fi
          echo "ran $ran self-running test script(s)"
