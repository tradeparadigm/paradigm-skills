name: execution-tape tests

on:
  push:
    paths:
      - 'skills/data-discovery/**'
      - 'skills/block-analyst/scripts/collect_analysis.py'
      - 'skills/options-recap/scripts/collect_recap.py'
      - '.github/workflows/execution-tape-tests.yml'
  pull_request:
    paths:
      - 'skills/data-discovery/**'
      - 'skills/block-analyst/scripts/collect_analysis.py'
      - 'skills/options-recap/scripts/collect_recap.py'
      - '.github/workflows/execution-tape-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest polars boto3
      - name: Test bounded execution reads without AWS access
        run: python -m pytest skills/data-discovery/tests/test_execution_tape.py -q
