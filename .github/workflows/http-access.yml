name: http access check

# Every HTTP and S3 call in a skill script must go through http_client.py. Runs on
# any skill change, so a new skill directory is covered without editing this file.
on:
  pull_request:
    paths:
      - 'skills/**'
      - '.github/scripts/check_http_access.py'
      - '.github/scripts/test_check_http_access.py'
      - '.github/workflows/http-access.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/scripts/check_http_access.py'
      - '.github/scripts/test_check_http_access.py'
      - '.github/workflows/http-access.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The check catches what it claims to
        run: python3 .github/scripts/test_check_http_access.py
      - name: Skill scripts use http_client.py
        run: python3 .github/scripts/check_http_access.py
